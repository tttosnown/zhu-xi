<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="筑习">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>筑习 · 建筑考研 Routine</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--text:#222;--muted:#777;--line:#e8e8e4;--accent:#222;--ok:#3f7d57;--warn:#a77728;--bad:#a04a4a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif}
button,input,select,textarea{font:inherit}button{border:0;background:none;color:inherit}
.app{max-width:900px;margin:auto;padding:22px 18px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:25px;margin:0}.date{color:var(--muted);font-size:13px;margin-top:4px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 3px 18px rgba(0,0,0,.035)}
.kicker{font-size:12px;color:var(--muted);margin-bottom:8px}.big{font-size:42px;font-weight:700;letter-spacing:-2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}.day{padding:9px 2px;border-radius:12px;text-align:center;font-size:12px;color:var(--muted)}.day.active{background:#222;color:#fff}
.progress{height:7px;background:#ecece8;border-radius:99px;overflow:hidden;margin-top:10px}.progress>i{display:block;height:100%;background:#333}
.task{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}
.check{width:25px;height:25px;border:1.5px solid #bbb;border-radius:8px;flex:0 0 auto}.check.done{background:#222;border-color:#222;color:#fff;text-align:center;line-height:24px}
.taskmain{flex:1}.tasktitle{font-size:15px}.meta{font-size:12px;color:var(--muted);margin-top:4px}.stars{letter-spacing:1px;font-size:11px}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.pill{padding:9px 13px;border:1px solid var(--line);border-radius:12px;background:#fff}.primary{background:#222;color:#fff}
.section{margin-top:14px}.empty{color:var(--muted);padding:16px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:10}.modal.show{display:flex}
.sheet{width:min(700px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:20px}
label{display:block;font-size:12px;color:var(--muted);margin:13px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fafaf8}textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.close{float:right}.q{padding:13px 0;border-bottom:1px solid var(--line)}.q:last-child{border:0}
.score{font-size:32px;font-weight:700}.small{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;color:#fff;padding:11px 15px;border-radius:14px;display:none;z-index:20}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>筑习</h1><div class="date" id="today"></div></div>
  <button class="iconbtn" onclick="openSettings()">⚙︎</button>
</header>

<div class="grid">
  <section class="card">
    <div class="kicker">本周学习</div>
    <div class="big" id="eff">—%</div>
    <div class="small">效率</div>
    <div class="week" id="week"></div>
  </section>
  <section class="card">
    <div class="kicker">今日</div>
    <div id="todayStats"></div>
    <div class="actions">
      <button class="pill primary" onclick="addTask()">＋ 添加任务</button>
      <button class="pill" onclick="openRoutine()">Routine</button>
    </div>
  </section>
</div>

<section class="card section">
  <div class="kicker">今日 Routine</div>
  <div id="tasks"></div>
</section>

<section class="card section">
  <div class="kicker">🏗 今日规范</div>
  <div id="codeQuestion"></div>
  <div class="actions"><button class="pill" onclick="openCodeAnswer()">回答</button></div>
</section>

<section class="card section">
  <div class="kicker">本周数据</div>
  <div id="weekly"></div>
</section>
</div>

<div class="modal" id="modal"><div class="sheet"><button class="pill close" onclick="closeModal()">关闭</button><div id="sheet"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='zhuxi_v11';
const SUBJECTS=['建筑史','建筑理论','建筑物理','建筑构造技术','英语','政治'];
const codeBank=[
 {q:'今日规范题：请从你正在复习的规范中，主动回忆一个与楼梯/疏散相关的关键规定，并写出适用条件。',a:'正式题库将在部署版中按你提供的规范 PDF 和指定考试版本建立；当前题目仅用于测试主动回忆流程。'},
 {q:'今日规范题：请主动回忆一个与无障碍设计相关的关键规定，并说明适用范围。',a:'正式题库将在部署版中按你提供的规范 PDF 和指定考试版本建立；当前题目仅用于测试主动回忆流程。'}
];
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{tasks:[],reviews:[],settings:{remind:true},codeIndex:0};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function iso(d=new Date()){let x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function fmt(d){return new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',weekday:'short'}).format(d)}
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}
function monday(d){d=new Date(d);let n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);d.setHours(0,0,0,0);return d}
function weekDates(){let m=monday(new Date());return Array.from({length:7},(_,i)=>{let d=new Date(m);d.setDate(m.getDate()+i);return d})}
function tasksToday(){return db.tasks.filter(t=>t.date===iso())}
function render(){
 document.getElementById('today').textContent=fmt(new Date());
 renderWeek(); renderTasks(); renderWeekly(); renderCode();
}
function renderWeek(){
 let ds=weekDates(), el=document.getElementById('week');
 el.innerHTML=ds.map(d=>`<div class="day ${iso(d)===iso()?'active':''}">${['一','二','三','四','五','六','日'][d.getDay()?d.getDay()-1:6]}<br>${d.getDate()}</div>`).join('');
 let w=db.tasks.filter(t=>ds.some(d=>iso(d)===t.date)), done=w.filter(t=>t.done).length;
 let completion=w.length?Math.round(done/w.length*100):0;
 let mastered=w.filter(t=>t.mastery!=null);
 let mastery=mastered.length?Math.round(mastered.reduce((s,t)=>s+t.mastery,0)/mastered.length):0;
 let hard=w.reduce((s,t)=>s+t.difficulty,0)||1, hardDone=w.filter(t=>t.done).reduce((s,t)=>s+t.difficulty,0);
 let efficiency=w.length?Math.round((hardDone/hard)*100):0;
 document.getElementById('eff').textContent=(w.length?efficiency:0)+'%';
 document.getElementById('weekly').innerHTML=`完成率　<b>${completion}%</b><br>掌握率　<b>${mastery}%</b><br>效率　<b>${efficiency}%</b>`;
 document.getElementById('todayStats').innerHTML=`<b>${tasksToday().filter(t=>t.done).length} / ${tasksToday().length}</b><div class="progress"><i style="width:${tasksToday().length?tasksToday().filter(t=>t.done).length/tasksToday().length*100:0}%"></i></div>`;
}
function renderTasks(){
 let ts=tasksToday(), el=document.getElementById('tasks');
 el.innerHTML=ts.length?ts.map(t=>`<div class="task">
 <button class="check ${t.done?'done':''}" onclick="toggleTask('${t.id}')">${t.done?'✓':''}</button>
 <div class="taskmain"><div class="tasktitle">${esc(t.title)}</div><div class="meta">${esc(t.subject)} · <span class="stars">${stars(t.difficulty)}</span>${t.quantity?' · '+t.quantity+'项':''}${t.mastery!=null?' · 掌握 '+t.mastery+'%':''}</div></div>
 <button class="pill" onclick="review('${t.id}')">检测</button>
 </div>`).join(''):'<div class="empty">今天还没有任务。</div>';
}
function toggleTask(x){let t=db.tasks.find(t=>t.id===x);t.done=!t.done;save();render();}
function addTask(pref={}){
 document.getElementById('sheet').innerHTML=`<h2>添加任务</h2>
 <label>科目</label><select id="fsub">${SUBJECTS.map(s=>`<option>${s}</option>`).join('')}</select>
 <label>任务内容</label><input id="ftitle" placeholder="例如：外国建筑史｜文艺复兴建筑">
 <div class="row"><div><label>难度</label><select id="fdiff">${[1,2,3,4,5].map(n=>`<option value="${n}">${stars(n)}</option>`).join('')}</select></div>
 <div><label>数量（英语/政治可用）</label><input id="fqty" placeholder="可留空"></div></div>
 <label>日期</label><input id="fdate" type="date" value="${iso()}">
 <label>重复</label><select id="frepeat"><option value="none">不重复</option><option value="daily">每天</option><option value="weekly">每周同一天</option></select>
 <div class="actions"><button class="pill primary" onclick="saveTask()">保存</button></div>`;
 openModal()
}
function saveTask(){
 let t={id:id(),subject:fsub.value,title:ftitle.value.trim()||'未命名任务',difficulty:+fdiff.value,quantity:(fsub.value==='英语'||fsub.value==='政治')?fqty.value.trim():'',date:fdate.value,repeat:frepeat.value,done:false,mastery:null};
 db.tasks.push(t);
 if(t.repeat==='daily'||t.repeat==='weekly'){for(let i=1;i<=28;i++){let d=new Date(t.date);d.setDate(d.getDate()+i);if(t.repeat==='weekly'&&i%7)continue;db.tasks.push({...t,id:id(),date:iso(d),done:false,mastery:null})}}
 save();closeModal();render();toast('任务已建立')
}
function review(x){
 let t=db.tasks.find(t=>t.id===x);if(!t)return;
 const qs={
  '建筑史':['不看资料，你能否复述这一部分的历史背景？','不看资料，你能否说出核心内容/主要特征？','你能否说出相关人物、作品及关系？','你能否解释其思想或影响？','如果现在出现简答题，你能否独立组织答案？'],
  '建筑理论':['能否说出概念及定义？','能否解释产生背景？','能否复述核心观点？','能否联系代表人物/作品？','能否组织成考试答案？'],
  '建筑物理':['能否说出基本概念？','能否解释原理？','能否说出关键参数/条件？','能否解释影响因素？','能否联系建筑应用？'],
  '建筑构造技术':['能否说出构造目的？','能否复述构造组成？','能否说出基本做法？','能否解释关键节点/条件？','能否指出易错点？'],
  '英语':['不看资料，你能否回忆本次重点？','能否解释错题/生词？','能否再次独立完成相关判断？'],
  '政治':['能否复述核心概念？','能否解释其逻辑关系？','能否联系题目进行判断？']
 }[t.subject]||['不看资料，你能否复述核心内容？','能否解释它？','能否用于考试？'];
 document.getElementById('sheet').innerHTML=`<h2>${esc(t.title)} · 熟悉度检测</h2>${qs.map((q,i)=>`<div class="q"><b>${i+1}.</b> ${q}<label>你的状态</label><select id="q${i}"><option value="100">完全可以</option><option value="80">大部分可以</option><option value="60">只能想起一点</option><option value="30">基本不会</option></select><label>可选：主动回忆记录</label><textarea id="a${i}" placeholder="可以输入，也可以留空，直接在脑中回答。"></textarea></div>`).join('')}<div class="actions"><button class="pill primary" onclick="saveReview('${t.id}',${qs.length})">生成掌握率</button></div>`;
 openModal()
}
function saveReview(x,n){
 let vals=[];for(let i=0;i<n;i++)vals.push(+document.getElementById('q'+i).value);
 let m=Math.round(vals.reduce((a,b)=>a+b,0)/n),t=db.tasks.find(t=>t.id===x);t.mastery=m;
 db.reviews.push({id:id(),taskId:x,date:iso(),mastery:m});save();closeModal();render();toast('掌握率：'+m+'%')
}
function renderCode(){let c=codeBank[db.codeIndex%codeBank.length];document.getElementById('codeQuestion').innerHTML=`<div style="font-size:16px">${esc(c.q)}</div><div class="small" style="margin-top:8px">规范题库待根据你提供的正式 PDF 建立</div>`}
function openCodeAnswer(){let c=codeBank[db.codeIndex%codeBank.length];document.getElementById('sheet').innerHTML=`<h2>今日规范</h2><p>${esc(c.q)}</p><textarea id="codeA" placeholder="先独立回答，再查看答案。"></textarea><div class="actions"><button class="pill primary" onclick="showCode()">查看依据</button></div>`;openModal()}
function showCode(){let c=codeBank[db.codeIndex%codeBank.length];document.getElementById('sheet').innerHTML+=`<div class="card section"><b>当前版本提示</b><p class="small">${esc(c.a)}</p></div>`}
function openRoutine(){document.getElementById('sheet').innerHTML=`<h2>Routine</h2><p class="small">固定任务会按规则生成未来实例。你可以继续通过“添加任务”建立新的周期任务。</p><div class="actions"><button class="pill primary" onclick="addTask()">＋ 新建 Routine</button></div>`;openModal()}
function openSettings(){document.getElementById('sheet').innerHTML=`<h2>设置</h2><p>第一版数据全部保存在本机浏览器。</p><p class="small">iPad 主屏幕安装需要通过 HTTPS 网页；20:00 的系统级推送通知需要后续接入 Web Push/服务器，因此本轻量版先保留应用内提醒能力。</p><div class="actions"><button class="pill" onclick="exportData()">导出数据</button><button class="pill" onclick="clearData()">清空数据</button></div>`;openModal()}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='筑习_学习数据.json';a.click()}
function clearData(){if(confirm('确定清空所有本机数据吗？')){localStorage.removeItem(KEY);location.reload()}}
function openModal(){document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
