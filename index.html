<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建筑与消防规范知识树系统</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        header p {
            color: #666;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        .card h2 {
            margin-bottom: 16px;
            color: var(--primary-color);
            font-size: 1.25rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        /* 规范查找部分样式 */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .btn-secondary {
            background-color: #95a5a6;
        }
        .btn-secondary:hover {
            background-color: #7f8c8d;
        }

        .btn-danger {
            background-color: #e74c3c;
            padding: 4px 8px;
            font-size: 0.8rem;
        }
        .btn-danger:hover {
            background-color: #c0392b;
        }

        .search-results {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            background: #fafafa;
        }

        .result-item {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-title {
            font-weight: bold;
            color: var(--primary-color);
        }

        .result-desc {
            font-size: 0.9rem;
            color: #555;
            margin-top: 4px;
        }

        /* 知识树思维导图无限叠加样式 */
        .tree-container {
            overflow-x: auto;
            padding: 10px 0;
        }

        ul.tree-list {
            list-style-type: none;
            padding-left: 20px;
            position: relative;
        }

        ul.tree-list::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            border-left: 2px dashed #cbd5e1;
        }

        .tree-node {
            margin: 8px 0;
            position: relative;
        }

        .tree-node-content {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            width: fit-content;
        }

        .tree-node-content input[type="text"] {
            border: 1px solid transparent;
            background: transparent;
            font-size: 0.95rem;
            outline: none;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .tree-node-content input[type="text"]:focus {
            background: white;
            border-color: var(--accent-color);
        }

        .tree-actions {
            display: flex;
            gap: 4px;
        }

        .tree-actions button {
            padding: 2px 6px;
            font-size: 0.75rem;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            background: #cbd5e1;
            color: #333;
        }

        .tree-actions button:hover {
            background: #94a3b8;
            color: white;
        }

        .tree-actions button.add-btn {
            background: #2ecc71;
            color: white;
        }
        .tree-actions button.add-btn:hover {
            background: #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>建筑防火与无障碍规范知识树系统</h1>
        <p>支持无限向下分支叠加的思维导图知识管理与国标规范智能检索工具</p>
    </header>

    <!-- 模块二：规范查找部分 -->
    <div class="card">
        <h2>建筑消防与无障碍规范智能查找</h2>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="请输入关键字查找（例如：防火分区、疏散、无障碍、坡道、消火栓...）">
            <button class="btn" onclick="searchNorms()">查找规范</button>
        </div>
        <div class="search-results" id="searchResults">
            <div class="result-item">
                <div class="result-desc" style="color: #888; text-align: center;">请输入关键词或点击查找以检索中国国家最新建筑防火与无障碍规范条文。</div>
            </div>
        </div>
    </div>

    <!-- 模块一：知识树板块 -->
    <div class="card">
        <h2>知识树管理（思维导图模式）</h2>
        <p style="font-size: 0.85rem; color: #666; margin-bottom: 12px;">提示：您可以点击节点文本进行修改，通过“+子节点”无限向下扩展分支，或进行删除。</p>
        <div class="tree-container" id="treeRootContainer">
            <!-- 动态渲染的树状结构 -->
        </div>
    </div>
</div>

<script>
    // 中国国家最新建筑消防防火与无障碍规范核心数据库
    const nationalNormsDatabase = [
        {
            title: "《建筑防火通用规范》 GB 55037-2022",
            category: "防火通用",
            content: "自2023年6月1日起实施，为强制性工程建设规范，全部条文必须严格执行。涵盖了建筑分类、耐火等级、总平面布局、防火分区、平面布置、安全疏散、建筑构造及灭火救援设施等底线要求。"
        },
        {
            title: "《消防设施通用规范》 GB 55036-2022",
            category: "消防设施",
            content: "自2023年3月1日起实施，为强制性工程建设规范。规范了室内外消火栓系统、自动灭火系统、火灾自动报警系统、防烟排烟设施以及消防应急照明和疏散指示标志的设置标准。"
        },
        {
            title: "《建筑设计防火规范》 GB 50016-2014（2018年版）",
            category: "建筑防火",
            content: "规定了厂房、仓库、民用建筑的耐火等级、防火间距、防火分区（如一、二级民用建筑每个防火分区最大允许建筑面积通常不宜超过2500平方米）、安全疏散距离及宽度指标。"
        },
        {
            title: "《建筑与市政工程无障碍通用规范》 GB 55019-2021",
            category: "无障碍规范",
            content: "强制性工程建设规范。明确了无障碍通道、轮椅坡道（坡度不应大于1:12，高度较大时应采用缓坡）、无障碍出入口、无障碍电梯、无障碍厕所及无障碍停车位的具体设置标准。"
        },
        {
            title: "无障碍坡道与台阶设计细则",
            category: "无障碍细节",
            content: "无障碍轮椅坡道净宽度不应小于1.00m，起点和终点应设置轮椅回转面积不小于1.50m×1.50m的平缓休息平台；坡道两侧应设置高度不小于0.90m的扶手，且扶手应首尾连贯。"
        },
        {
            title: "消防车道与救援场地设置要求",
            category: "消防救援",
            content: "高层建筑应设置环形消防车道，或沿建筑的一个长边设置消防车道；消防车道的净宽度和净空高度均不应小于4.0m，转弯半径应满足消防车转弯作业需求。"
        }
    ];

    // 规范查找功能
    function searchNorms() {
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        const resultsContainer = document.getElementById('searchResults');
        resultsContainer.innerHTML = '';

        const filtered = nationalNormsDatabase.filter(item => 
            item.title.toLowerCase().includes(keyword) || 
            item.content.toLowerCase().includes(keyword) ||
            item.category.toLowerCase().includes(keyword)
        );

        if (filtered.length === 0) {
            resultsContainer.innerHTML = `<div class="result-item"><div class="result-desc" style="color: #e74c3c;">未找到与“${keyword}”相关的最新国家规范条文，请尝试其他关键词（如：防火分区、无障碍、消火栓）。</div></div>`;
            return;
        }

        filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `
                <div class="result-title">[${item.category}] ${item.title}</div>
                <div class="result-desc">${item.content}</div>
            `;
            resultsContainer.appendChild(div);
        });
    }

    // 初始知识树数据（支持无限向下叠加结构）
    let knowledgeTreeData = {
        id: 1,
        name: "建筑消防与无障碍知识体系",
        children: [
            {
                id: 2,
                name: "建筑防火规范",
                children: [
                    { id: 5, name: "防火分区与分隔", children: [] },
                    { id: 6, name: "安全疏散设计", children: [] }
                ]
            },
            {
                id: 3,
                name: "消防设施配置",
                children: [
                    { id: 7, name: "自动喷水灭火系统", children: [] },
                    { id: 8, name: "火灾自动报警系统", children: [] }
                ]
            },
            {
                id: 4,
                name: "无障碍设计规范",
                children: [
                    { id: 9, name: "无障碍出入口与通道", children: [] },
                    { id: 10, name: "轮椅坡道与扶手", children: [] }
                ]
            }
        ]
    };

    // 渲染知识树递归函数
    function renderTree(node) {
        let html = `<li class="tree-node" data-id="${node.id}">`;
        html += `<div class="tree-node-content">`;
        html += `<input type="text" value="${node.name}" onchange="updateNodeName(${node.id}, this.value)">`;
        html += `<div class="tree-actions">`;
        html += `<button class="add-btn" onclick="addChildNode(${node.id})">+子节点</button>`;
        if (node.id !== 1) { // 根节点不允许直接删除
            html += `<button class="btn-danger" onclick="deleteNode(${node.id})">删除</button>`;
        }
        html += `</div></div>`;

        if (node.children && node.children.length > 0) {
            html += `<ul class="tree-list">`;
            node.children.forEach(child => {
                html += renderTree(child);
            });
            html += `</ul>`;
        }
        html += `</li>`;
        return html;
    }

    function renderTreeContainer() {
        const container = document.getElementById('treeRootContainer');
        container.innerHTML = `<ul class="tree-list" style="padding-left:0; border-left:none;">${renderTree(knowledgeTreeData)}</ul>`;
    }

    // 查找节点辅助函数
    function findAndExecute(node, id, callback) {
        if (node.id === id) {
            return callback(node);
        }
        if (node.children) {
            for (let i = 0; i < node.children.length; i++) {
                const res = findAndExecute(node.children[i], id, callback);
                if (res) return res;
            }
        }
        return null;
    }

    // 更新节点名称
    function updateNodeName(id, newName) {
        findAndExecute(knowledgeTreeData, id, (node) => {
            node.name = newName;
        });
    }

    // 添加子节点（实现无限向下叠加）
    function addChildNode(parentId) {
        findAndExecute(knowledgeTreeData, parentId, (node) => {
            if (!node.children) {
                node.children = [];
            }
            const newId = Date.now(); // 生成唯一ID
            node.children.push({
                id: newId,
                name: "新建分支节点",
                children: []
            });
        });
        renderTreeContainer();
    }

    // 删除节点
    function deleteNode(id) {
        function removeRecursive(node, targetId) {
            if (!node.children) return false;
            const index = node.children.findIndex(c => c.id === targetId);
            if (index !== -1) {
                node.children.splice(index, 1);
                return true;
            }
            for (let i = 0; i < node.children.length; i++) {
                if (removeRecursive(node.children[i], targetId)) return true;
            }
            return false;
        }
        removeRecursive(knowledgeTreeData, id);
        renderTreeContainer();
    }

    // 页面加载完成后初始化渲染树
    window.onload = function() {
        renderTreeContainer();
        searchNorms(); // 默认展示部分规范
    };
</script>

</body>
</html>
