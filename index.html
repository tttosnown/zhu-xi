<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>筑息 · 考研建筑学智能备考与复盘看板</title>
    <style>
        :root {
            --bg-main: #F5F5F7;
            --bg-card: #FFFFFF;
            --text-main: #1D1D1F;
            --text-sub: #86868B;
            --accent: #0071E3;
            --accent-hover: #0077ED;
            --separator: #D2D2D7;
            --radius: 12px;
            --shadow: 0 4px 16px rgba(0,0,0,0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 0 10px;
        }

        header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        header .date-display {
            font-size: 14px;
            color: var(--text-sub);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 0.5px solid rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
        }

        .card h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 区域跨度分配 */
        .col-today { grid-column: span 7; }
        .col-tree { grid-column: span 5; }
        .col-code { grid-column: span 6; }
        .col-english { grid-column: span 6; }
        .col-vuln { grid-column: span 6; }
        .col-weekly { grid-column: span 6; }

        @media (max-width: 900px) {
            .col-today, .col-tree, .col-code, .col-english, .col-vuln, .col-weekly {
                grid-column: span 12;
            }
        }

        /* 按钮与通用样式 */
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-secondary {
            background: #E5E5EA;
            color: var(--text-main);
        }
        .btn-secondary:hover { background: #D1D1D6; }

        /* 任务列表 */
        .task-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }
        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 0.5px solid var(--separator);
        }
        .task-item:last-child { border-bottom: none; }
        .task-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .task-info input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #E8F2FF;
            color: var(--accent);
            font-weight: 500;
        }

        /* 树状知识结构 */
        .tree-container {
            max-height: 300px;
            overflow-y: auto;
            font-size: 13px;
        }
        ul.tree-list {
            list-style-type: none;
            padding-left: 16px;
            border-left: 1px dashed var(--separator);
            margin-top: 4px;
        }
        li.tree-node {
            margin: 6px 0;
        }
        .tree-node-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #F9F9FB;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .tree-node-content input {
            border: none;
            background: transparent;
            font-size: 13px;
            color: var(--text-main);
            outline: none;
            width: 60%;
        }
        .tree-actions {
            display: flex;
            gap: 4px;
        }
        .tree-actions button {
            background: none;
            border: none;
            font-size: 11px;
            cursor: pointer;
            color: var(--accent);
            padding: 2px 4px;
            border-radius: 4px;
        }
        .tree-actions button:hover { background: #E5E5EA; }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--separator); border-radius: 3px; }

        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-box {
            background: #FFF;
            padding: 24px;
            border-radius: 14px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .modal-box h3 { font-size: 16px; margin-bottom: 12px; }
        .modal-box input, .modal-box select, .modal-box textarea {
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 12px;
            border: 0.5px solid var(--separator);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }
        .modal-box textarea { resize: vertical; height: 80px; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 8px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏛️ 筑息 · 考研建筑学智能备考看板</h1>
        <div class="date-display" id="currentDateDisplay">今天是：加载中...</div>
    </header>

    <div class="grid-layout">

        <!-- 1. 今日任务与主动回忆打卡 -->
        <div class="card col-today">
            <h2>
                <span>📋 今日任务与主动回忆打卡</span>
                <div style="display:flex; gap:6px;">
                    <button class="btn btn-secondary" onclick="exportDataJSON()">导出数据</button>
                    <button class="btn btn-secondary" onclick="clearAllData()" style="color:#FF3B30;">清空</button>
                    <button class="btn" onclick="openAddTaskModal()">+ 新增任务</button>
                </div>
            </h2>
            <ul class="task-list" id="todayTaskList">
                <!-- 动态渲染 -->
            </ul>
        </div>

        <!-- 2. 思维导图知识树 -->
        <div class="card col-tree">
            <h2>
                <span>🧠 核心知识树 (建筑史/理论)</span>
                <button class="btn" onclick="addChildNode(1)">+ 根节点</button>
            </h2>
            <div class="tree-container" id="treeRootContainer">
                <!-- 动态渲染 -->
            </div>
        </div>

        <!-- 3. 国家规范查询与考点抽查 -->
        <div class="card col-code">
            <h2>
                <span>📐 国家规范速查 & 考点抽查</span>
                <button class="btn btn-secondary" onclick="loadDailyCodeQuestion()">换一题</button>
            </h2>
            <div style="margin-bottom: 12px;">
                <input type="text" id="searchInput" placeholder="搜规范名称或关键词（如防火、无障碍、疏散）..." oninput="searchNorms()" style="width: 100%; padding: 6px 10px; border-radius: 6px; border: 0.5px solid var(--separator); font-size: 13px; outline: none;">
                <div id="searchResults" style="max-height: 100px; overflow-y: auto; margin-top: 6px; font-size: 12px;"></div>
            </div>
            <div style="background: #F9F9FB; padding: 10px; border-radius: 8px; border: 0.5px solid var(--separator);">
                <div id="codeQTitle" style="font-weight: 600; font-size: 13px; color: var(--accent);">加载中...</div>
                <div id="codeQContent" style="font-size: 12px; margin-top: 4px; color: var(--text-main);">加载中...</div>
                <button class="btn btn-secondary" style="margin-top: 8px; font-size: 11px;" onclick="toggleCodeAnswer()">查看参考解析</button>
                <div id="codeQAnswer" style="font-size: 12px; color: var(--text-sub); margin-top: 6px; display: none; border-top: 0.5px dashed var(--separator); padding-top: 4px;"></div>
            </div>
        </div>

        <!-- 4. 英语错题与复盘追踪 -->
        <div class="card col-english">
            <h2>
                <span>📖 英语错题复盘与月度统计</span>
                <div style="display:flex; gap:6px;">
                    <button class="btn btn-secondary" onclick="openEnglishMonthlySummaryModal()">月度统计</button>
                    <button class="btn" onclick="openAddEnglishErrorModal()">+ 记错题</button>
                </div>
            </h2>
            <div id="englishErrorListContainer" style="max-height: 220px; overflow-y: auto;">
                <!-- 动态渲染 -->
            </div>
        </div>

        <!-- 5. 专业课盲点漏洞本 -->
        <div class="card col-vuln">
            <h2>
                <span>⚠️ 专业课盲点漏洞本</span>
                <button class="btn" onclick="openAddVulnerabilityModal()">+ 记漏洞</button>
            </h2>
            <div id="vulnerabilityListContainer" style="max-height: 220px; overflow-y: auto;">
                <!-- 动态渲染 -->
            </div>
        </div>

        <!-- 6. 每周自动学习总结看板 -->
        <div class="card col-weekly">
            <h2>
                <span>📊 每周自动学习总结报告</span>
                <button class="btn btn-secondary" onclick="renderWeeklySummary()">刷新总结</button>
            </h2>
            <div id="weeklySummaryContent" style="font-size: 13px; line-height: 1.5; color: var(--text-main);">
                点击刷新生成本周综合数据分析报告。
            </div>
        </div>

    </div>
</div>

<!-- 弹窗1：主动回忆掌握率打卡 -->
<div class="modal" id="taskModal">
    <div class="modal-box">
        <h3 id="modalTitle">主动回忆打卡</h3>
        <div id="modalBody"></div>
        <div class="modal-btns" style="margin-top: 14px;">
            <button class="btn btn-secondary" onclick="closeTaskModal()">关闭</button>
        </div>
    </div>
</div>

<!-- 弹窗2：英语错题录入 -->
<div class="modal" id="englishErrorModal">
    <div class="modal-box">
        <h3>📝 记录英语错题复盘</h3>
        <label style="font-size: 12px; color: var(--text-sub);">错误类型：</label>
        <select id="errType">
            <option value="阅读理解长难句">阅读理解长难句</option>
            <option value="词汇辨析失误">词汇辨析失误</option>
            <option value="逻辑推理错误">逻辑推理错误</option>
            <option value="写作句型语法">写作句型语法</option>
            <option value="翻译漏译错译">翻译漏译错译</option>
        </select>
        <label style="font-size: 12px; color: var(--text-sub);">错因复盘：</label>
        <textarea id="errReason" placeholder="写下为什么选错、思维盲区是什么..."></textarea>
        <label style="font-size: 12px; color: var(--text-sub);">下次提醒/注意事项：</label>
        <input type="text" id="errTip" placeholder="如：见转折词要高度敏感，不可主观臆断">
        <div class="modal-btns">
            <button class="btn btn-secondary" onclick="closeEnglishErrorModal()">取消</button>
            <button class="btn" onclick="saveEnglishError()">保存记录</button>
        </div>
    </div>
</div>

<!-- 弹窗3：英语月度统计分析 -->
<div class="modal" id="englishMonthlyModal">
    <div class="modal-box" style="max-width: 450px;">
        <h3>📊 英语错题月度深度统计</h3>
        <div id="monthlySummaryBody" style="font-size: 13px; line-height: 1.6;"></div>
        <div class="modal-btns" style="margin-top: 16px;">
            <button class="btn" onclick="closeEnglishMonthlyModal()">关闭</button>
        </div>
    </div>
</div>

<!-- 弹窗4：专业课漏洞录入 -->
<div class="modal" id="vulnerabilityModal">
    <div class="modal-box">
        <h3>⚠️ 记录专业课盲点/小漏洞</h3>
        <label style="font-size: 12px; color: var(--text-sub);">细节点内容（如：某流派代表建筑师及关键平面布局形式）：</label>
        <textarea id="vulnDesc" placeholder="简要写下背诵或真题中卡壳的细节点..."></textarea>
        <div class="modal-btns">
            <button class="btn btn-secondary" onclick="closeVulnerabilityModal()">取消</button>
            <button class="btn" onclick="saveVulnerability()">保存漏洞</button>
        </div>
    </div>
</div>

<script>
    // --- 数据库与初始化状态 ---
    const todayObj = new Date();
    const todayStr = `${todayObj.getFullYear()}-${String(todayObj.getMonth() + 1).padStart(2, '0')}-${String(todayObj.getDate()).padStart(2, '0')}`;
    document.getElementById('currentDateDisplay').innerText = `今天是：${todayStr}`;

    const subjects = ['建筑史', '建筑理论', '建筑物理', '构造技术', '英语', '政治'];

    // 默认任务
    let tasks = JSON.parse(localStorage.getItem('zhuxi_tasks')) || [
        { id: 1, title: '中外建筑史：明清故宫与官式建筑做法复习', subject: '建筑史', date: todayStr, completed: false, mastery: 50 },
        { id: 2, title: '建筑理论：形式与功能主义经典文献精读', subject: '建筑理论', date: todayStr, completed: false, mastery: 60 },
        { id: 3, title: '英语一：真题阅读精读 1 篇 + 长难句拆解', subject: '英语', date: todayStr, completed: false, mastery: 40 }
    ];

    // 默认知识树
    let subjectTree = JSON.parse(localStorage.getItem('zhuxi_tree')) || {
        id: 1,
        name: "建筑学考研知识总库",
        children: [
            {
                id: 2,
                name: "中国建筑史",
                children: [
                    { id: 21, name: "古代建筑特征与木构架", children: [] },
                    { id: 22, name: "宋《营造法式》与清《工程做法则例》", children: [] }
                ]
            },
            {
                id: 3,
                name: "外国建筑史",
                children: [
                    { id: 31, name: "古典时期与文艺复兴", children: [] },
                    { id: 32, name: "现代建筑运动与大师思想", children: [] }
                ]
            }
        ]
    };

    // 英语复盘库
    let englishErrors = JSON.parse(localStorage.getItem('zhuxi_english_errors')) || [
        { id: 101, date: todayStr, type: '阅读理解长难句', reason: '主句和定语从句嵌套错位，误把修饰成分当成了核心谓语。', tip: '先抓主干（主谓宾），再看从句修饰。' }
    ];

    // 专业课漏洞库
    let vulnerabilities = JSON.parse(localStorage.getItem('zhuxi_vulnerabilities')) || [
        { id: 201, date: todayStr, desc: '高层建筑剪力墙与框架剪力墙结构的最大适用高度临界值记忆不清。', mastered: false }
    ];

    // 国家规范条文示例库
    const nationalNormsDatabase = [
        { category: '防火规范', title: 'GB 50016-2014 建筑设计防火规范', content: '民用建筑耐火等级分为一、二、三、四级。地下室、半地下室耐火等级应为一级。' },
        { category: '无障碍', title: 'GB 50763-2012 无障碍设计规范', content: '无障碍坡道坡度不应大于1:12，高差大于0.75m时应设台阶与坡道结合。' },
        { category: '住宅设计', title: 'GB 50096-2011 住宅设计规范', content: '七层及以上住宅或住户入口层楼面距室外设计地面高度超过16m的住宅必须设置电梯。' },
        { category: '办公建筑', title: 'JGJ 67-2006 办公建筑设计规范', content: '办公室人均使用面积不应小于3.0平米，单间办公室净高不应低于2.60m。' }
    ];

    // 考点抽查题库
    const codeBank = [
        { title: '高层建筑疏散距离', content: '高层民用建筑袋形走道尽端的房间，其疏散门至安全出口的最大距离是多少？', answer: '根据《防火规范》，位于两个安全出口之间的房间疏散门至最近安全出口的直线距离为20米，袋形走道尽端为15米。' },
        { title: '无障碍电梯轿厢', content: '供轮椅乘用者使用的电梯轿厢，其深度和宽度尺寸有何最低要求？', answer: '根据《无障碍设计规范》，深度不应小于1.40m，宽度不应小于1.10m，门净宽度不应小于0.80m。' },
        { title: '中国古建台基分级', content: '中国古代建筑中，哪种台基等级最高？常用于什么建筑？', answer: '须弥座（金刚座），最高级，常用于宫殿、寺庙的主殿（如太和殿）。' }
    ];

    function saveData(key, data) {
        localStorage.setItem('zhuxi_' + key, JSON.stringify(data));
    }

    // --- 任务看板函数 ---
    function renderDashboard() {
        const listContainer = document.getElementById('todayTaskList');
        if (!listContainer) return;
        listContainer.innerHTML = '';

        if (tasks.length === 0) {
            listContainer.innerHTML = '<li style="font-size:12px; color:var(--text-sub); text-align:center; padding:15px;">暂无今日任务，请点击右上角新增！</li>';
            return;
        }

        tasks.forEach(t => {
            const li = document.createElement('li');
            li.className = 'task-item';
            li.innerHTML = `
                <div class="task-info">
                    <input type="checkbox" ${t.completed ? 'checked' : ''} onclick="toggleTask(${t.id})">
                    <span style="${t.completed ? 'text-decoration:line-through; color:var(--text-sub);' : ''}">${t.title}</span>
                    <span class="badge">${t.subject}</span>
                </div>
                <div style="display:flex; gap:6px; align-items:center;">
                    <button class="btn btn-secondary" style="font-size:10px; padding:2px 6px;" onclick="openRecallModal(${t.id})">回忆评级(${t.mastery || 50}%)</button>
                    <button class="btn" style="background:#FF3B30; font-size:10px; padding:2px 6px;" onclick="deleteTask(${t.id})">删</button>
                </div>
            `;
            listContainer.appendChild(li);
        });
        renderWeeklySummary();
    }

    function toggleTask(id) {
        tasks = tasks.map(t => t.id === id ? {...t, completed: !t.completed} : t);
        saveData('tasks', tasks);
        renderDashboard();
    }

    function deleteTask(id) {
        if (confirm('确认删除这条任务吗？')) {
            tasks = tasks.filter(t => t.id !== id);
            saveData('tasks', tasks);
            renderDashboard();
        }
    }

    function openAddTaskModal() {
        const title = prompt('请输入今日学习任务名称：', '');
        if (!title) return;
        const subject = prompt('请输入学科分类（建筑史/建筑理论/建筑物理/构造技术/英语/政治）：', '建筑史');
        if (!subject) return;

        tasks.push({
            id: Date.now(),
            title: title,
            subject: subjects.includes(subject) ? subject : '通用',
            date: todayStr,
            completed: false,
            mastery: 50
        });
        saveData('tasks', tasks);
        renderDashboard();
    }

    function openRecallModal(id) {
        const t = tasks.find(x => x.id === id);
        if (!t) return;
        document.getElementById('modalTitle').innerText = `🧠 主动回忆：${t.title}`;
        document.getElementById('modalBody').innerHTML = `
            <p style="font-size:12px; color:var(--text-sub); margin-bottom:8px;">请闭眼或在草稿纸上复述该考点，然后评估掌握率：</p>
            <div style="display:flex; gap:10px; margin-bottom:12px;">
                <button class="btn btn-small" onclick="updateMastery(${id}, 30)">掌握差 (30%)</button>
                <button class="btn btn-small" onclick="updateMastery(${id}, 70)">基本掌握 (70%)</button>
                <button class="btn btn-small" onclick="updateMastery(${id}, 100)">完全掌握 (100%)</button>
            </div>
            <p style="font-size:12px; color:var(--text-sub);">当前掌握率：<b>${t.mastery || 50}%</b></p>
        `;
        document.getElementById('taskModal').classList.add('active');
    }

    function closeTaskModal() {
        document.getElementById('taskModal').classList.remove('active');
    }

    function updateMastery(id, score) {
        tasks = tasks.map(t => t.id === id ? {...t, mastery: score, completed: true} : t);
        saveData('tasks', tasks);
        closeTaskModal();
        renderDashboard();
        alert('掌握率已更新！');
    }

    // --- 英语复盘模块函数（含修改与删除） ---
    function openAddEnglishErrorModal() {
        document.getElementById('errReason').value = '';
        document.getElementById('errTip').value = '';

        const reason = document.getElementById('errReason').value.trim();

    function deleteEnglishError(id) {

            englishErrors = englishErrors.filter(e => e.id !== id);
            saveData('english_errors', englishErrors);
            renderEnglishErrors();
        }
    }

    function editEnglishError(id) {
        const e = englishErrors.find(item => item.id === id);
        if (!e) return;
        const newReason = prompt('修改错因：', e.reason);
        if (newReason === null) return;
        const newTip = prompt('修改下次提醒：', e.tip);
        if (newTip === null) return;

        englishErrors = englishErrors.map(item => {
            if (item.id === id) {
                return { ...item, reason: newReason.trim() || item.reason, tip: newTip.trim() || '无' };
            }
            return item;
        });
        saveData('english_errors', englishErrors);
        renderEnglishErrors();
    }

    function openEnglishMonthlySummaryModal() {
        const total = englishErrors.length;
        const typeCounts = {};
        englishErrors.forEach(e => {
            typeCounts[e.type] = (typeCounts[e.type] || 0) + 1;
        });

        const sortedTypes = Object.entries(typeCounts).sort((a,b) => b[1] - a[1]);
         
        let html = `<p><b>本月共记录错误：</b> ${total} 次。</p>`;
        html += `<p style="margin-top:6px;"><b>错误类型统计：</b></p><ul style="padding-left:20px; margin-bottom:8px;">`;
        for (let [k, v] of sortedTypes) {
            html += `<li>${k}：${v} 次</li>`;
        }
        html += `</ul>`;

        if (sortedTypes.length > 0) {
            html += `<p><b>🔥 本月最突出 Top 问题：</b> ${sortedTypes[0][0]}</p>`;
            if (sortedTypes[0][1] >= 3) {
                html += `<p style="color:#FF3B30; margin-top:4px;">⚠️ 注意：「${sortedTypes[0][0]}」连续出现多次，是当前最需要集中解决的瓶颈！</p>`;
            }
            html += `<p style="margin-top:6px;"><b>💡 下个月建议：</b> 重点针对“${sortedTypes[0][0]}”进行专项突破，做真题时遇到犹豫选项必须强制回原文找硬证据核对。</p>`;
        } else {
            html += `<p>本月暂无充分错误数据，请持续记录。</p>`;
        }

        document.getElementById('monthlySummaryBody').innerHTML = html;
        document.getElementById('englishMonthlyModal').classList.add('active');
    }

        document.getElementById('englishMonthlyModal').classList.remove('active');

    // --- 每周自动学习总结函数 ---
    function renderWeeklySummary() {
        const container = document.getElementById('weeklySummaryContent');
        if (!container) return;

        const totalTasks = tasks.length;
        const completedTasks = tasks.filter(t => t.completed).length;
        const completionRate = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

        let subStats = {};
        subjects.forEach(s => {
            const sTasks = tasks.filter(t => t.subject === s);
            const sDone = sTasks.filter(t => t.completed).length;
            subStats[s] = { total: sTasks.length, done: sDone, rate: sTasks.length > 0 ? sDone / sTasks.length : 0 };
        });

        let bestSub = "暂无";
        let worstSub = "暂无";
        let maxR = -1;
        let minR = 2;
        for (let [s, obj] of Object.entries(subStats)) {
            if (obj.total > 0) {
                if (obj.rate > maxR) { maxR = obj.rate; bestSub = s; }
                if (obj.rate < minR) { minR = obj.rate; worstSub = s; }
            }
        }

        const weeklyErrCount = englishErrors.length;
        const unmasteredVuln = vulnerabilities.filter(v => !v.mastered).length;
        const totalVuln = vulnerabilities.length;

        let html = `
        <p><b>📊 本周总览：</b> 本周共安排任务 <b>${totalTasks}</b> 项，已完成 <b>${completedTasks}</b> 项，综合完成率 <b>${completionRate}%</b>。</p>
        <p style="margin-top:6px;"><b>📚 学科表现：</b> 本周表现较好的学科为 <b>${bestSub}</b>，完成度相对较弱的学科为 <b>${worstSub}</b>。</p>
        <p style="margin-top:6px;"><b>📖 英语与漏洞：</b> 累计记录英语错误复盘 <b>${weeklyErrCount}</b> 次；专业课细节点漏洞共记录 <b>${totalVuln}</b> 个，当前尚有 <b>${unmasteredVuln}</b> 个未完全掌握。</p>
        <p style="margin-top:6px; color:var(--accent);"><b>💡 下周建议：</b> 本周任务完成率 ${completionRate}%。建议针对薄弱学科（如 ${worstSub}）加大复习权重，英语继续强化选项辨析与原文证据核对，同时加快消灭未掌握的专业课小漏洞！</p>
        `;
        container.innerHTML = html;
    }
